<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识库工作台 · 结构预览</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#fff; --ink:#1c1b19; --muted:#6b6862; --line:#e3e1dc;
  --accent:#3a6b4f; --warn:#8a5a1e; --warn-soft:#fbf1e2; --err:#9b3232; --err-soft:#fbeaea;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --c-body:#2f6b4f; --c-nav:#4a5f8a; --c-meta:#7a5aa0; --c-list:#a06a2a;
  --c-page:#2a7a8a; --c-attach:#8a4a6a; --c-foot:#6b6862; --c-side:#6b6862;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#191817; --panel:#232120; --ink:#eceae6; --muted:#9a958d; --line:#37342f;
  --accent:#7fb894; --warn:#d9a760; --warn-soft:#33291a; --err:#e08585; --err-soft:#341f1f;
  --c-body:#7fb894; --c-nav:#8fa4d4; --c-meta:#b79ad8; --c-list:#d6a86a;
  --c-page:#78bccb; --c-attach:#cf94b4; --c-foot:#9a958d; --c-side:#9a958d;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:21px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.stage{display:inline-block;margin-top:10px;padding:3px 9px;border-radius:4px;
  background:var(--warn-soft);color:var(--warn);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin:18px 0}
.card h2{font-size:14px;margin:0 0 16px;color:var(--muted);font-weight:600;letter-spacing:.04em}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.row{display:grid;grid-template-columns:1fr 250px 100px;gap:12px;margin-bottom:12px}
.hint{font-size:12px;color:var(--muted);margin:0 0 16px}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 20px;
  font:inherit;font-size:14px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.note{padding:11px 13px;border-radius:6px;font-size:13px;margin:16px 0}
.note.err{background:var(--err-soft);color:var(--err)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.page{border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.page>summary{padding:11px 14px;cursor:pointer;font-size:13px;background:var(--bg);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.page>summary::-webkit-details-marker{display:none}
.page>summary::before{content:"▸";color:var(--muted);font-size:11px}
.page[open]>summary::before{content:"▾"}
.purl{font-family:var(--mono);font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:1px 6px;border-radius:3px;color:#fff;white-space:nowrap}
.regions{padding:4px 14px 14px}
.region{display:grid;grid-template-columns:96px 62px 1fr;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:13px;align-items:start}
.region:last-child{border-bottom:0}
.rname{font-weight:600;font-size:12.5px}
.conf{font-family:var(--mono);font-size:12px;color:var(--muted)}
.bar{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.bar>i{display:block;height:100%}
code{font-family:var(--mono);font-size:12px;background:var(--bg);padding:1px 5px;
  border-radius:3px;word-break:break-all}
.snip{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.6}
.tpl{border:1px solid var(--line);border-radius:8px;padding:13px;margin-bottom:11px}
.tplhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:7px}
.tplid{font-family:var(--mono);font-size:12px;color:var(--muted)}
.shape{font-family:var(--mono);font-size:13px;color:var(--accent)}
.tpl ul{margin:0;padding-left:18px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.hidden{display:none}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite;margin-right:7px;vertical-align:-1px}
@keyframes r{to{transform:rotate(360deg)}}
@media(max-width:760px){.row{grid-template-columns:1fr}.region{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<h1>知识库工作台 · 结构预览</h1>
<p class="sub">给一个栏目列表页，看它和它的详情页被切成哪些分区、又聚成几种模板。</p>
<span class="stage">临时预览 · 已完成分区识别与模板聚类；栏目树、规模估算、勾选与爬取尚未实现</span>

<div class="card">
  <div class="row">
    <div><label for="url">栏目列表页 URL</label>
      <input id="url" value="https://ccs.fjnu.edu.cn/kydt/list.htm"></div>
    <div><label for="contact">联系方式（写进 User-Agent）</label>
      <input id="contact" value="https://github.com/kbwb"></div>
    <div><label for="n">详情页样本数</label>
      <input id="n" type="number" min="1" max="10" value="3"></div>
  </div>
  <p class="hint">每次请求间隔 2 秒，3 个样本约需 10 秒。抓取遵守 robots.txt。</p>
  <button id="go">开始分析</button>
</div>

<div id="msg"></div>

<div id="out" class="hidden">
  <div class="card">
    <h2>页面模板</h2>
    <p class="hint" style="margin-bottom:14px">
      结构相同且 URL 形状相同的页面归为一类。采样以模板为单位——多个栏目共用同一模板时只抓一次。</p>
    <div id="tpls"></div>
  </div>
  <div class="card">
    <h2>逐页分区</h2>
    <p class="hint" style="margin-bottom:14px">
      点开任一页面查看它的八类分区。置信度低于 0.5 的标为待确认；正文识别失败会显式标出而非静默略过。</p>
    <div id="pages"></div>
  </div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const META = {
  article_body:{n:"正文",     c:"var(--c-body)"},
  navigation:  {n:"导航",     c:"var(--c-nav)"},
  article_meta:{n:"元信息",   c:"var(--c-meta)"},
  article_list:{n:"条目列表", c:"var(--c-list)"},
  pagination:  {n:"分页",     c:"var(--c-page)"},
  attachment:  {n:"附件",     c:"var(--c-attach)"},
  footer:      {n:"页脚",     c:"var(--c-foot)"},
  sidebar:     {n:"侧栏",     c:"var(--c-side)"},
};
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const note = (k,t) => $("msg").innerHTML = `<div class="note ${k}">${t}</div>`;

function renderTemplates(list){
  $("tpls").innerHTML = list.map(t => `
    <div class="tpl">
      <div class="tplhead">
        <span class="shape">${esc(t.url_shape)}</span>
        <span class="tplid">${esc(t.template_id)} · ${t.page_count} 个页面</span>
      </div>
      <ul>${t.sample_urls.map(u => `<li>${esc(u)}</li>`).join("")}</ul>
    </div>`).join("");
}

function renderPages(pages){
  $("pages").innerHTML = pages.map((p, i) => {
    const chips = p.regions.map(r =>
      `<span class="chip" style="background:${META[r.type]?.c || 'var(--muted)'}">${META[r.type]?.n || r.type}</span>`).join("");
    const rows = p.regions.map(r => {
      const pct = Math.round(r.confidence * 100);
      const col = META[r.type]?.c || "var(--muted)";
      return `<div class="region">
        <div><span class="rname" style="color:${col}">${META[r.type]?.n || r.type}</span></div>
        <div><span class="conf">${r.confidence.toFixed(2)}</span>
             <span class="bar"><i style="width:${pct}%;background:${col}"></i></span></div>
        <div><code>${esc(r.selector)}</code>
          ${r.note ? `<div class="snip" style="color:var(--warn)">⚠ ${esc(r.note)}</div>` : ""}
          ${r.snippet ? `<div class="snip">${esc(r.snippet)}…</div>` : ""}</div>
      </div>`;
    }).join("");
    return `<details class="page" ${i === 0 ? "open" : ""}>
      <summary><span class="purl">${esc(p.url)}</span><span class="chips">${chips}</span></summary>
      <div class="regions">${rows}</div></details>`;
  }).join("");
}

$("go").onclick = async () => {
  const b = $("go");
  b.disabled = true; b.innerHTML = '<span class="spin"></span>分析中…';
  $("msg").innerHTML = ""; $("out").classList.add("hidden");
  try{
    const res = await fetch("/api/structure-preview", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({entry_url:$("url").value.trim(), contact:$("contact").value.trim(),
                            max_samples:Number($("n").value)})
    });
    const d = await res.json();
    if(!res.ok){ note("err","分析失败：" + (typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail))); return; }
    renderTemplates(d.templates); renderPages(d.pages);
    $("out").classList.remove("hidden");
    const bad = d.skipped.length + d.failures.length;
    if(bad) note("warn", `${d.skipped.length} 个 URL 被 robots 跳过，${d.failures.length} 个抓取失败。`);
    if(!d.pages.length) note("warn","一个页面都没取到。可能填的是站点首页而非栏目列表页。");
  }catch(e){ note("err","请求失败：" + e.message); }
  finally{ b.disabled = false; b.textContent = "开始分析"; }
};
</script>
</body></html>
